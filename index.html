<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FAKD · Rauchpool</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: #1b1b24;
            color: #f2efe6;
            font-family: 'Press Start 2P', monospace, system-ui;
            font-size: 10px;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        main {
            max-width: 580px;
            margin: auto;
            padding: 22px 14px;
            text-align: center;
        }

        h1 {
            font-size: 14px;
            margin: 8px 0 10px;
            letter-spacing: 0.5px;
        }

        small {
            display: inline-block;
            margin-bottom: 8px;
            line-height: 1.8;
            opacity: .6;
            font-size: 9px;
        }

        #status {
            margin: 10px 0 14px;
        }

        canvas {
            image-rendering: pixelated;
            width: 100%;
            max-width: 560px;
            background: #1b1b24;
        }

        #timer-box {
            position: relative;
            margin: 6px auto 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 82px;
        }

        #time {
            display: inline-block;
            font-size: 38px;
            margin: 6px 0;
            padding: 10px 22px;
            background: rgba(18, 18, 24, 0.92);
            border: 2px solid #36364a;
            box-shadow: 0 0 0 2px #000, 3px 3px 0 #000;
            color: #ffffff;
            text-shadow: 
                -2px -2px 0 #000, 2px -2px 0 #000, 
                -2px 2px 0 #000, 2px 2px 0 #000,
                0 3px 0 #000, 3px 3px 0 #000;
            letter-spacing: 1px;
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .is-done #time {
            transform: translateY(-56px);
        }

        #clock {
            display: inline-block;
            background: #121218;
            border: 2px solid #36364a;
            box-shadow: 0 0 0 1px #000, 2px 2px 0 #000;
            padding: 6px 11px;
            font-size: 8px;
            color: #f2efe6;
            text-shadow: 1px 1px 0 #000;
        }

        #stage-content p {
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            margin: 8px 0;
            font-size: 9px;
        }

        button,
        input {
            font: inherit;
            font-size: 9px;
            padding: 9px 14px;
            border: 2px solid #f2efe6;
            background: #1b1b24;
            color: #f2efe6;
            border-radius: 0;
            box-shadow: 0 0 0 1px #000, 2px 2px 0 #000;
        }

        #name {
            max-width: 170px;
        }

        button {
            cursor: pointer;
            background: #e8553d;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }

        button.alt {
            background: #1b1b24;
        }

        button:active {
            transform: translate(1px, 1px);
            box-shadow: 0 0 0 1px #000, 1px 1px 0 #000;
        }

        .row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 14px 0;
        }

        #pool-box {
            display: inline-block;
            width: 100%;
            max-width: 400px;
            margin: 14px auto 0;
            padding: 14px 16px 16px;
            background: rgba(18, 18, 24, 0.94);
            border: 2px solid #36364a;
            box-shadow: 0 0 0 2px #000, 3px 3px 0 #000;
            position: relative;
            z-index: 2;
        }

        #pool-meta {
            font-size: 9px;
            color: #f2efe6;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0 #000;
        }

        #pool-meta b {
            color: #ffd23f;
            font-weight: normal;
            text-shadow: 1px 1px 0 #000;
        }

        #members {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 24px;
            align-items: center;
        }

        #members:empty::after {
            content: "Noch niemand im Pool";
            font-size: 8px;
            opacity: .5;
            color: #f2efe6;
            display: block;
            padding: 4px 0;
        }

        #members span {
            display: inline-flex;
            align-items: center;
            background: #0c0c12;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 9px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0 #000;
        }

        #go {
            color: #ffd23f;
            font-size: clamp(10px, 3.2vw, 13px);
            display: inline-block;
            margin: 0;
            padding: 8px 18px;
            background: #14141d;
            border: 2px solid #ffd23f;
            box-shadow: 0 0 0 2px #000, 3px 3px 0 #000;
            animation: b .6s steps(2) infinite;
            text-shadow: 1px 1px 0 #000;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            max-width: 95vw;
            box-sizing: border-box;
        }

        #go[hidden] {
            display: none !important;
        }

        @keyframes b {
            50% {
                opacity: .3
            }
        }

        .pop {
            position: fixed;
            width: 300px;
            max-width: calc(100vw - 20px);
            background: #c9c6b8;
            color: #111;
            border: 3px solid #111;
            box-shadow: 6px 6px 0 #000;
            z-index: 50;
            text-align: left;
            font-size: 10px;
        }

        .pop .bar {
            background: #2b3a8c;
            color: #fff;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        .pop .bar b {
            background: #c9c6b8;
            color: #111;
            border: 2px solid #111;
            padding: 1px 6px;
            cursor: pointer;
            font-size: 10px;
        }

        .pop .body {
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 10px;
            line-height: 1.6;
        }

        .pop-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .pop-link {
            display: inline-block;
            background: #e8553d;
            color: #fff;
            text-decoration: none;
            padding: 6px 8px;
            border: 2px solid #111;
            box-shadow: 2px 2px 0 #111;
            font-size: 9px;
            line-height: 1.4;
            cursor: pointer;
            word-break: break-word;
            font-family: inherit;
        }

        .pop-link:hover {
            background: #ff6a52;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 #111;
        }

        .pop-link:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #111;
        }

        .pop-link.alt {
            background: #2b3a8c;
        }

        .pop-link.alt:hover {
            background: #3e52b8;
        }

        .spr {
            width: 36px;
            height: 36px;
            flex: none;
            image-rendering: pixelated;
            margin-top: 2px;
        }

        small {
            opacity: .6;
            font-size: 9px
        }
    </style>
</head>

<body>
    <main>
        <h1>FAKD · RAUCHPOOL</h1>
        <small>Mind. 3 Leute im Pool → 6 Min Countdown. Je mehr, desto schneller.</small>
        <p id="status"></p>
        <canvas id="cv" width="140" height="64"></canvas>
        <div id="stage" style="position:relative;width:100%;max-width:560px;margin:0 auto;min-height:220px">
            <canvas id="cv2"
                style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:transparent;"></canvas>
            <div id="stage-content" style="position:relative;z-index:1;pointer-events:auto;padding-bottom:84px">
                <div id="timer-box">
                    <div id="time">06:00</div>
                    <div id="go" hidden>JETZT GEMEINSAM LOSGEHEN!</div>
                </div>
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0;">
                    <div id="clock"></div>
                    <button class="alt" id="mutebtn" onclick="toggleMute()"
                        style="font-size:8px;padding:6px 10px;border-width:2px">TON: AN</button>
                </div>
                <div class="row" id="joinrow"><input id="name" maxlength="20" placeholder="Dein Name"><button
                        onclick="join()">Pool beitreten</button></div>
                <div class="row" id="leaverow" hidden><button class="alt" onclick="leave()">Verlassen</button><button
                        onclick="reset()" id="resetb">Neue Runde</button></div>
                <div id="pool-box">
                    <div id="pool-meta">Im Pool: <b id="cnt">0</b> · Tempo: <b id="spd">–</b></div>
                    <div id="members"></div>
                </div>
            </div>
        </div>
        <p><small id="mode"></small></p>
    </main>
    <footer
        style="text-align:center;padding:10px 0 16px;opacity:.5;font-family:'Press Start 2P',monospace;font-size:8px;">
        Rauchen ist tödlich.
    </footer>
    <script>
        // ===== EINSTELLUNG: Firebase Realtime Database URL hier eintragen (siehe Anleitung) =====
        const DB_URL = 'https://gemeinsam-rauchen-default-rtdb.europe-west1.firebasedatabase.app/'; // z. B. 'https://fakd-rauch-default-rtdb.europe-west1.firebasedatabase.app'
        // ======================================================================================
        const TOTAL = 360, MIN = 3, EXPIRE = 45 * 60e3;
        const $ = id => document.getElementById(id);
        const me = localStorage.rpId || (localStorage.rpId = Math.random().toString(36).slice(2, 10));
        $('name').value = localStorage.rpName || '';
        let members = {}, offset = 0, ctx = null, masterGain = null, wasDone = false, loaded = false;
        let muted = false;

        /* AudioContext fuer alle Geraete (Desktop, iOS Safari & Android) */
        function getAudioCtx() {
            if (!ctx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) {
                    ctx = new AudioClass();
                    masterGain = ctx.createGain();
                    masterGain.gain.value = muted ? 0 : 0.85;
                    masterGain.connect(ctx.destination);
                }
            }
            return ctx;
        }

        function unlockAudio() {
            const ac = getAudioCtx();
            if (!ac) return;
            if (ac.state === 'suspended') {
                ac.resume().catch(() => {});
            }
            // Keepalive damit iOS / macOS Safari den AudioContext nach kurzen Pausen nicht wieder schlafen legt
            if (!window.__audioKeepalive && ac.state === 'running') {
                try {
                    const osc = ac.createOscillator();
                    const g = ac.createGain();
                    g.gain.value = 0.00001;
                    osc.connect(g);
                    g.connect(ac.destination);
                    osc.start();
                    window.__audioKeepalive = true;
                } catch (e) {}
            }
        }

        ['touchstart', 'touchend', 'click', 'pointerdown', 'keydown'].forEach(ev => {
            window.addEventListener(ev, unlockAudio, { passive: true });
        });
        const now = () => Date.now() + offset;

        /* ---------- Speicher: Firebase REST oder lokaler Demo-Modus ---------- */
        const demo = !DB_URL;
        $('mode').textContent = demo ? 'DEMO-MODUS (nur dieser Browser) – DB_URL im Code eintragen' : 'Live-Modus';
        const url = p => `${DB_URL.replace(/\/$/, '')}/pool/${p}.json`;
        async function put(id, name) {
            if (demo) { const m = JSON.parse(localStorage.rpDemo || '{}'); m[id] = { name, t: Date.now() }; localStorage.rpDemo = JSON.stringify(m); return pull() }
            await fetch(url('members/' + id), { method: 'PUT', body: JSON.stringify({ name, t: { '.sv': 'timestamp' } }) }); pull()
        }
        async function del(id) {
            if (demo) { const m = JSON.parse(localStorage.rpDemo || '{}'); delete m[id]; localStorage.rpDemo = JSON.stringify(m); return pull() }
            await fetch(url('members/' + id), { method: 'DELETE', keepalive: true }); pull()
        }
        async function clearAll() {
            if (demo) { localStorage.rpDemo = '{}'; return pull() }
            await fetch(url('members'), { method: 'DELETE' }); pull()
        }
        async function pull() {
            try { members = demo ? JSON.parse(localStorage.rpDemo || '{}') : (await (await fetch(url('members'))).json()) || {} } catch (e) { }
            loaded = true; render()
        }
        async function syncClock() {
            if (demo) return;
            try {
                const a = Date.now(); const r = await (await fetch(url('ping/' + me), { method: 'PUT', body: JSON.stringify({ '.sv': 'timestamp' }) })).json();
                offset = r - (a + Date.now()) / 2; fetch(url('ping/' + me), { method: 'DELETE' })
            } catch (e) { }
        }
        if (demo) { addEventListener('storage', pull) }
        else { try { const es = new EventSource(url('members')); es.addEventListener('put', pull); es.addEventListener('patch', pull) } catch (e) { } }
        setInterval(pull, 5000);

        /* ---------- Logik ---------- */
        let demoRun = null;
        function startDemo() {
            muted = false;
            localStorage.rpMuted = '0';
            if (masterGain) masterGain.gain.value = 0.85;
            $('mutebtn').textContent = 'TON: AN';
            unlockAudio();
            playStartBlip();
            demoRun = {
                startT: Date.now(),
                totalDuration: 10,
                totalCigs: 2
            };
            fallingCigs.length = 0;
            looseCrumbs.length = 0;
            lastCompleted = 0;
            rollSeed = 17;
            wasDone = false;
            currentDoneCig = -1;
            lastPlayedSoundP = -1;
            loaded = true;
            $('stage').classList.remove('is-done');
            render();
        }

        function calc() {
            if (demoRun) {
                const elapsed = Math.max(0, (Date.now() - demoRun.startT) / 1000);
                const remain = Math.max(0, demoRun.totalDuration - elapsed);
                return {
                    n: demoRun.totalCigs,
                    state: remain <= 0 ? 'done' : 'run',
                    remain,
                    speed: 1.0
                };
            }
            const ts = Object.values(members).filter(m => m && m.t && now() - m.t < EXPIRE).map(m => m.t).sort((a, b) => a - b);
            const n = ts.length; if (n < MIN) return { n, state: 'wait', remain: TOTAL };
            let p = 0; for (let k = MIN; k <= n; k++) { const s = ts[k - 1], e = k < n ? ts[k] : now(); p += Math.max(0, (e - s) / 1000) * (k / MIN) }
            const remain = Math.max(0, TOTAL - p); return { n, state: remain <= 0 ? 'done' : 'run', remain, speed: n / MIN }
        }
        function fmt(s) { s = Math.ceil(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') }
        function inPool() { return members[me] }
        function join() {
            demoRun = null;
            const nm = $('name').value.trim(); if (!nm) { $('name').focus(); $('name').style.borderColor = '#e8553d'; return }
            localStorage.rpName = nm;
            unlockAudio();
            playStartBlip();
            put(me, nm);
        }
        function leave() { demoRun = null; del(me); }
        function reset() {
            if (demoRun) {
                demoRun = null;
                fallingCigs.length = 0;
                looseCrumbs.length = 0;
                lastCompleted = 0;
                wasDone = false;
                c.clearRect(0, 0, RW, RH);
                render();
                return;
            }
            if (confirm('Pool für alle leeren und neue Runde starten?')) clearAll();
        }
        addEventListener('beforeunload', () => { if (!demo && inPool()) fetch(url('members/' + me), { method: 'DELETE', keepalive: true }) });

        /* ---------- Ton ---------- */
        function unlock() { unlockAudio(); }
        function toggleMute() {
            muted = !muted;
            localStorage.rpMuted = muted ? '1' : '0';
            $('mutebtn').textContent = muted ? 'TON: AUS' : 'TON: AN';
            if (masterGain) {
                masterGain.gain.value = muted ? 0 : 0.85;
            }
            if (!muted) {
                unlockAudio();
                playStartBlip();
            }
        }

        function playStartBlip() {
            if (muted) return;
            const ac = getAudioCtx();
            if (!ac) return;
            if (ac.state === 'suspended') ac.resume().catch(() => {});
            try {
                const t = ac.currentTime;
                const o = ac.createOscillator(), g = ac.createGain();
                o.type = 'square';
                o.frequency.setValueAtTime(587, t);
                o.frequency.setValueAtTime(880, t + 0.06);
                g.gain.setValueAtTime(0.25, t);
                g.gain.setValueAtTime(0.25, t + 0.06);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
                o.connect(g);
                g.connect(masterGain || ac.destination);
                o.start(t);
                o.stop(t + 0.15);
            } catch (e) {}
        }

        // Web Audio Synthesizer für Papier-Rollgeräusche (keine externen Dateien nötig)
        let paperNoiseBuf = null;
        function getPaperNoise() {
            const ac = getAudioCtx();
            if (!ac) return null;
            if (paperNoiseBuf) return paperNoiseBuf;
            try {
                const len = Math.floor(ac.sampleRate * 1.5);
                paperNoiseBuf = ac.createBuffer(1, len, ac.sampleRate);
                const data = paperNoiseBuf.getChannelData(0);
                for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
                return paperNoiseBuf;
            } catch (e) {
                return null;
            }
        }

        function playPaperCrinkle(dur = 0.10, gain = 0.25, freq = 2400) {
            if (muted) return;
            const ac = getAudioCtx();
            if (!ac) return;
            if (ac.state === 'suspended') ac.resume().catch(() => {});
            const noise = getPaperNoise();
            if (!noise) return;
            try {
                const src = ac.createBufferSource();
                src.buffer = noise;

                const bp = ac.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = freq;
                bp.Q.value = 1.8;

                const g = ac.createGain();
                const t = ac.currentTime;
                g.gain.setValueAtTime(0.01, t);
                g.gain.linearRampToValueAtTime(gain, t + dur * 0.2);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);

                src.connect(bp);
                bp.connect(g);
                g.connect(masterGain || ac.destination);

                src.start(t, Math.random() * 0.5, dur);
            } catch (e) {}
        }

        function playPaperRollSweep(dur = 0.18, gain = 0.28) {
            if (muted) return;
            const ac = getAudioCtx();
            if (!ac) return;
            if (ac.state === 'suspended') ac.resume().catch(() => {});
            const noise = getPaperNoise();
            if (!noise) return;
            try {
                const src = ac.createBufferSource();
                src.buffer = noise;

                const bp = ac.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.setValueAtTime(1400, ac.currentTime);
                bp.frequency.exponentialRampToValueAtTime(3200, ac.currentTime + dur);
                bp.Q.value = 2.0;

                const g = ac.createGain();
                const t = ac.currentTime;
                g.gain.setValueAtTime(0.01, t);
                g.gain.linearRampToValueAtTime(gain, t + dur * 0.2);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);

                src.connect(bp);
                bp.connect(g);
                g.connect(masterGain || ac.destination);

                src.start(t, Math.random() * 0.5, dur);
            } catch (e) {}
        }

        function playCigaretteLandSound() {
            if (muted) return;
            const ac = getAudioCtx();
            if (!ac) return;
            if (ac.state === 'suspended') ac.resume().catch(() => {});
            try {
                const t = ac.currentTime;
                const o = ac.createOscillator(), g = ac.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(440, t);
                o.frequency.exponentialRampToValueAtTime(140, t + 0.07);
                g.gain.setValueAtTime(0.40, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
                o.connect(g);
                g.connect(masterGain || ac.destination);
                o.start(t);
                o.stop(t + 0.08);
            } catch (e) {}
        }

        const soundMilestones = [
            { p: 0.04, fn: () => playPaperCrinkle(0.12, 0.26, 2200) }, // Blatt entfaltet
            { p: 0.16, fn: () => playPaperCrinkle(0.08, 0.22, 3200) }, // Tabak rieselt
            { p: 0.26, fn: () => playPaperCrinkle(0.08, 0.22, 3000) }, // Tabak rieselt
            { p: 0.38, fn: () => playPaperRollSweep(0.18, 0.28) },     // Papier rollt ein
            { p: 0.50, fn: () => playPaperRollSweep(0.18, 0.28) },     // Papier rollt ein
            { p: 0.68, fn: () => playPaperCrinkle(0.09, 0.24, 2600) }, // Filter schiebt rein
            { p: 0.82, fn: () => playPaperRollSweep(0.14, 0.26) }      // Klebenaht glattstreichen
        ];
        let lastPlayedSoundP = -1, currentDoneCig = -1;
        function checkPaperSound(currentP, cigIdx) {
            if (cigIdx !== currentDoneCig) {
                currentDoneCig = cigIdx;
                lastPlayedSoundP = -1;
            }
            soundMilestones.forEach(m => {
                if (lastPlayedSoundP < m.p && currentP >= m.p) {
                    m.fn();
                }
            });
            lastPlayedSoundP = currentP;
        }

        function jingle() {
            if (muted) return;
            const ac = getAudioCtx();
            if (!ac) return;

            const playNotes = () => {
                try {
                    const delay = ac.createDelay(0.5);
                    const feedback = ac.createGain();
                    const delayGain = ac.createGain();
                    delay.delayTime.value = 0.18;
                    feedback.gain.value = 0.35;
                    delayGain.gain.value = 0.45;
                    delay.connect(feedback);
                    feedback.connect(delay);
                    delay.connect(delayGain);
                    delayGain.connect(masterGain || ac.destination);
                    const notes = [523, 659, 784, 1047, 784, 1047];
                    notes.forEach((f, i) => {
                        const o = ac.createOscillator(), g = ac.createGain();
                        o.type = 'square';
                        o.frequency.value = f;
                        o.connect(g);
                        g.connect(masterGain || ac.destination);
                        g.connect(delay);
                        const t = ac.currentTime + i * 0.2;
                        g.gain.setValueAtTime(0.35, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
                        o.start(t);
                        o.stop(t + 0.2);
                    });
                } catch (e) {}
            };

            if (ac.state === 'suspended') {
                ac.resume().then(playNotes).catch(playNotes);
            } else {
                playNotes();
            }
        }

        /* ---------- Render ---------- */
        let S = { n: 0, state: 'wait', remain: TOTAL };
        function render() {
            S = calc(); const j = !!inPool();
            const isDone = S.state === 'done';
            $('stage').classList.toggle('is-done', isDone);
            $('joinrow').hidden = j || !!demoRun;
            $('leaverow').hidden = !j && !demoRun;
            $('resetb').hidden = !isDone && !demoRun;
            $('cnt').textContent = S.n;
            $('spd').textContent = S.state === 'run' ? S.speed.toFixed(1) + 'x' : '–';
            const mList = demoRun ? [{ name: 'Demo 1' }, { name: 'Demo 2' }] : Object.values(members);
            $('members').innerHTML = mList.filter(m => m && m.name).map(m => `<span>${m.name.replace(/[<>&"]/g, '')}</span>`).join('');
            $('status').textContent = S.state === 'wait' ? `Noch ${Math.max(0, MIN - S.n)} Person(en) fehlen …` : S.state === 'run' ? (demoRun ? 'Demo-Countdown läuft!' : 'Countdown läuft!') : 'Zeit ist um!';
            $('go').hidden = !isDone;
            if (isDone && !wasDone && loaded) { jingle(); setTimeout(jingle, 1500); }
            wasDone = isDone;
        }
        /* ---------- Animation ---------- */
        const cv = $('cv'), c = cv.getContext('2d');
        const cv2 = $('cv2'), c2 = cv2.getContext('2d');
        let prevT = 0, lastCompleted = 0, rollSeed = 17;
        const fallingCigs = [];
        $('mutebtn').textContent = muted ? 'TON: AUS' : 'TON: AN';

        // Geometrie Zigarette (Canvas-Pixel, 4× CSS-Skalierung)
        const RW = 140, RH = 64;
        const CX0 = 8, CY0 = 26, CTW = 110, CFW = 18, CTH = 12;

        function tCol(x, y, seed) {
            const v = (x * 11 + y * 7 + seed * 23 + (x * y) % 7) % 12;
            return v < 4 ? '#6b3a18' : v < 8 ? '#7a4a20' : v < 10 ? '#8a5228' : '#9a6030';
        }

        function drawFilterOn(ctx, fx, fy, fw, fh) {
            // Weiß-gräulicher Filter (wie Slim- / Aktivkohlefilter)
            ctx.fillStyle = '#dad6cb'; ctx.fillRect(fx, fy, fw, fh);
            ctx.fillStyle = '#f5f3ec'; ctx.fillRect(fx, fy, fw, 2);           // Zylinder-Glanzlicht oben
            ctx.fillStyle = '#b2aea4'; ctx.fillRect(fx, fy + fh - 2, fw, 2); // Zylinder-Schatten unten
            for (let i = 2; i < fw; i += 3) {
                ctx.fillStyle = '#c4c0b5';
                ctx.fillRect(fx + i, fy + 2, 1, fh - 4);
            }
            ctx.fillStyle = '#9e9a90'; ctx.fillRect(fx + fw - 1, fy, 1, fh); // Rechter Rand
            ctx.fillStyle = '#8a867c'; ctx.fillRect(fx, fy, 1, fh);          // Trennring zum Papier
        }

        // Einheitliches Zeichnen der fertigen Zigarette (oben im Rolling-Canvas und unten im Physik-Canvas)
        // Volle Dicke/Höhe CTH=12 (nicht schmaler werdend, gerader Zylinder),
        // Filter rechts, gerades Tabakende links mit sichtbaren Fasern
        function drawCigarette(ctx, cx, cy, angle = 0) {
            ctx.save();
            ctx.translate(cx, cy);
            if (angle) ctx.rotate(angle);

            const halfL = CTW / 2; // 55
            const halfH = CTH / 2; // 6
            const x0 = -halfL;
            const y0 = -halfH;
            const w = CTW;         // 110
            const h = CTH;         // 12
            const fw = CFW;        // 18
            const paperW = w - fw; // 92

            // Weißes Papier (Zylinderform mit oberem Glanzlicht und unterem Schatten)
            ctx.fillStyle = '#f0ede3';
            ctx.fillRect(x0, y0, paperW, h);

            // Obere Zylinder-Lichtkante
            ctx.fillStyle = '#f8f5eb';
            ctx.fillRect(x0 + 3, y0 + 1, paperW - 3, 2);
            // Unterer Zylinder-Schatten
            ctx.fillStyle = '#d8d4c4';
            ctx.fillRect(x0 + 3, y0 + h - 3, paperW - 3, 2);
            // Dezente Papier-Maserung / Klebelinie
            ctx.fillStyle = '#e2ded2';
            ctx.fillRect(x0 + 8, y0 + Math.floor(h * 0.58), paperW - 8, 1);

            // Tabakspitze links: Gerades zylindrisches Ende (Höhe 12, nicht schmaler werdend!)
            // Dunkle Tiefe im Hohlraum
            ctx.fillStyle = '#3f1f0a';
            ctx.fillRect(x0, y0 + 1, 3, h - 2);

            // Feine Tabakfasern am offenen Rand
            const tipColors = ['#6b3a18', '#7a4a20', '#8a5228', '#9a6030', '#5c2d12', '#7b441a'];
            for (let ty = 1; ty < h - 1; ty++) {
                const c1 = tipColors[(ty * 7 + 1) % tipColors.length];
                const c2 = tipColors[(ty * 11 + 3) % tipColors.length];
                ctx.fillStyle = c1;
                ctx.fillRect(x0 + (ty % 2), y0 + ty, 2, 1);
                ctx.fillStyle = c2;
                ctx.fillRect(x0 + 2, y0 + ty, 1 + ((ty + 1) % 2), 1);
            }
            // Winzige überstehende Fasern
            ctx.fillStyle = '#7a4a20';
            ctx.fillRect(x0 - 1, y0 + 3, 1, 2);
            ctx.fillStyle = '#9a6030';
            ctx.fillRect(x0 - 1, y0 + 7, 1, 2);

            // Filter rechts
            drawFilterOn(ctx, x0 + paperW, y0, fw, h);

            ctx.restore();
        }

        // Wie viele Zigaretten sind fertig gedreht?
        // Letzte Zigarette fertig bei remain=0.
        function completedCount(n, remain) {
            if (demoRun) {
                if (S.state === 'done') return demoRun.totalCigs;
                const cigDur = demoRun.totalDuration / demoRun.totalCigs;
                const elapsed = demoRun.totalDuration - remain;
                return Math.min(demoRun.totalCigs, Math.max(0, Math.floor(elapsed / cigDur)));
            }
            if (S.state === 'done') return n;
            if (S.state !== 'run' || n < MIN) return 0;
            return Math.max(0, n - Math.ceil(remain * n / TOTAL));
        }

        function drawRolling(phase, seed) {
            c.clearRect(0, 0, RW, RH);
            const x0 = CX0, y0 = CY0, tw = CTW, fw = CFW, h = CTH;

            if (phase < 0.10) {
                // Papier entfaltet sich aus gefaltetem Blatt
                const p = phase / 0.10;
                const w = Math.round(tw * p), hh = Math.max(2, Math.round(h * (0.15 + 0.85 * p)));
                const cx = x0 + (tw >> 1), cy = y0 + (h >> 1);
                c.fillStyle = '#f2efe6';
                c.fillRect(cx - (w >> 1), cy - (hh >> 1), w, hh);
                if (p < 0.8) { c.fillStyle = '#c0bcac'; c.fillRect(cx - 1, cy - (hh >> 1), 2, hh); }
                c.fillStyle = '#d0ccbc';
                c.fillRect(cx - (w >> 1), cy - (hh >> 1), w, 1);
                c.fillRect(cx - (w >> 1), cy + (hh >> 1) - 1, w, 1);

            } else if (phase < 0.34) {
                // Tabak fällt von oben in das offene Papier (Feiner Tabakregen, eher kleinere Stücke)
                const p = (phase - 0.10) / 0.24;
                c.fillStyle = '#f2efe6'; c.fillRect(x0, y0, tw, h);
                c.fillStyle = '#d0ccbc'; c.fillRect(x0, y0, tw, 1); c.fillRect(x0, y0 + h - 1, tw, 1);

                // Tabakbett im Papier baut sich von unten nach oben organisch auf
                const filledH = Math.min(h - 2, Math.max(1, Math.round((h - 2) * p * 1.12)));
                const startY = y0 + h - 1 - filledH;
                for (let px = 2; px < tw - 2; px++) {
                    const wave = Math.sin(px * 0.45 + seed) * 0.9 + Math.cos(px * 0.85 + seed * 2) * 0.6;
                    const pyStart = Math.min(y0 + h - 2, Math.max(y0 + 1, Math.round(startY + wave)));
                    for (let py = pyStart; py < y0 + h - 1; py++) {
                        c.fillStyle = tCol(px, py, seed);
                        c.fillRect(x0 + px, py, 1, 1);
                    }
                }

                // Tabakregen: Feinere, eher kleinere Tabakstückchen (1x1 und kleine 1x2 Flöckchen)
                const rainTime = Date.now() / 1000;
                const numParticles = 40;
                for (let i = 0; i < numParticles; i++) {
                    const spd = 20 + ((i * 19 + seed * 11) % 25);
                    const cycle = (rainTime * spd + i * 7.7) % (y0 + 6);
                    const dropY = cycle - 3;
                    if (dropY < 0 || dropY > y0 + 3) continue;

                    const baseX = 3 + ((i * 37 + seed * 17) % (tw - 8));
                    const wobble = Math.sin(rainTime * 4.5 + i * 2.2) * 1.2;
                    const dropX = Math.round(x0 + baseX + wobble);

                    c.fillStyle = tCol(dropX, Math.floor(dropY), seed + i * 7);
                    if (i % 4 === 0) {
                        c.fillRect(dropX, Math.floor(dropY), 1, 2); // 1x2 dünne Faser
                    } else if (i % 7 === 0) {
                        c.fillRect(dropX, Math.floor(dropY), 2, 1); // 2x1 feines Plättchen
                    } else {
                        c.fillRect(dropX, Math.floor(dropY), 1, 1); // 1x1 kleines Tabakstück
                    }
                }

            } else if (phase < 0.62) {
                // Papier rollt sich um den Tabak ein (volle Zylinderhöhe CTH=12)
                const p = (phase - 0.34) / 0.28;
                c.fillStyle = '#f2efe6'; c.fillRect(x0, y0, tw, h);
                const bandH = Math.max(1, Math.round((h - 2) * (1 - p)));
                const bandY = 1 + Math.floor(((h - 2) - bandH) / 2);
                for (let px = 1; px < tw - 1; px++)
                    for (let py = bandY; py < bandY + bandH; py++) {
                        c.fillStyle = tCol(px, py, seed);
                        c.fillRect(x0 + px, y0 + py, 1, 1);
                    }
                c.fillStyle = `rgba(0,0,0,${p * 0.22})`;
                c.fillRect(x0, y0, tw, 2); c.fillRect(x0, y0 + h - 2, tw, 2);
                const seamX = Math.round(tw * (0.5 + (1 - p) * 0.5));
                if (seamX < tw) { c.fillStyle = '#c4c0b0'; c.fillRect(x0 + seamX, y0, 1, h); }
                c.fillStyle = '#a8a498'; c.fillRect(x0, y0, tw, 1); c.fillRect(x0, y0 + h - 1, tw, 1);

            } else if (phase < 0.76) {
                // Filter schiebt sich von rechts heran (gerader Zylinder, Höhe 12)
                const p = (phase - 0.62) / 0.14;
                c.fillStyle = '#f0ede3'; c.fillRect(x0, y0, tw, h);
                c.fillStyle = '#f8f5eb'; c.fillRect(x0, y0 + 1, tw, 2);
                c.fillStyle = '#d8d4c4'; c.fillRect(x0, y0 + h - 2, tw, 2);
                c.fillStyle = '#e0ddd0'; c.fillRect(x0 + 8, y0 + Math.floor(h * 0.58), tw - 8, 1);

                // Tabakende links bereits sichtbar (gerade Kante, Höhe 12, nicht schmaler!)
                c.fillStyle = '#3f1f0a'; c.fillRect(x0, y0 + 1, 3, h - 2);
                for (let ty = 1; ty < h - 1; ty++) {
                    c.fillStyle = tCol(x0, ty, seed + ty);
                    c.fillRect(x0 + (ty % 2), y0 + ty, 2, 1);
                }

                const fX = Math.round(x0 + tw + (RW - x0 - tw) * (1 - p));
                drawFilterOn(c, fX, y0, fw, h);

            } else if (phase < 0.93) {
                // Fertigstellen & Zukleben: bleibt zylindrisch mit voller Höhe CTH=12 (nicht schmaler werdend!)
                const p = (phase - 0.76) / 0.17;
                c.fillStyle = '#f0ede3'; c.fillRect(x0, y0, tw, h);
                c.fillStyle = '#f8f5eb'; c.fillRect(x0, y0 + 1, tw, 2);
                c.fillStyle = '#d8d4c4'; c.fillRect(x0, y0 + h - 2, tw, 2);
                c.fillStyle = '#e0ddd0'; c.fillRect(x0 + 8, y0 + Math.floor(h * 0.58), tw - fw - 8, 1);

                // Tabakende links (gerader Zylinder, Höhe 12)
                c.fillStyle = '#3f1f0a'; c.fillRect(x0, y0 + 1, 3, h - 2);
                for (let ty = 1; ty < h - 1; ty++) {
                    c.fillStyle = tCol(x0, ty, seed + ty);
                    c.fillRect(x0 + (ty % 2), y0 + ty, 2, 1);
                }
                c.fillStyle = '#7a4a20'; c.fillRect(x0 - 1, y0 + 3, 1, 2);
                c.fillStyle = '#9a6030'; c.fillRect(x0 - 1, y0 + 7, 1, 2);

                // Filter rechts
                drawFilterOn(c, x0 + tw - fw, y0, fw, h);

                // Glanzstreifen beim Glattstreichen der Klebenaht
                const shineX = Math.round(x0 + (tw - fw) * p);
                c.fillStyle = 'rgba(255,255,255,0.4)';
                c.fillRect(shineX - 2, y0 + 1, 4, h - 2);

            } else {
                // Fertig gerollte Zigarette (sieht 100% genauso aus wie die fallende!)
                const cx = x0 + tw / 2;
                const cy = y0 + h / 2;
                if (phase < 0.97) {
                    drawCigarette(c, cx, cy, 0);
                } else {
                    // Kippt leicht an und fällt nach unten aus dem Canvas
                    const dropP = (phase - 0.97) / 0.03;
                    const dropY = cy + dropP * dropP * 28;
                    const dropRot = dropP * 0.12;
                    drawCigarette(c, cx, dropY, dropRot);
                }
            }
        }

        // Tabakbrösel bei Aufprall
        const looseCrumbs = [];
        function spawnImpactCrumbs(x, y, count = 2) {
            if (looseCrumbs.length > 50) looseCrumbs.splice(0, count);
            const cols = ['#6b3a18', '#7a4a20', '#8a5228', '#9a6030', '#5a2d10'];
            for (let i = 0; i < count; i++) {
                looseCrumbs.push({
                    x: x + (Math.random() - 0.5) * 4,
                    y: y + (Math.random() - 0.5) * 2,
                    vx: (Math.random() - 0.5) * 22,
                    vy: -Math.random() * 16 - 3,
                    col: cols[Math.floor(Math.random() * cols.length)]
                });
            }
        }

        // Stabile, wackelfreie Physik: Zigaretten fallen hinter den Text, landen auf unsichtbarer Fläche oder fallen daneben
        function updateAndDrawStack(dt) {
            const stageEl = $('stage');
            const stageW = stageEl ? stageEl.clientWidth : 560;
            const stageH = stageEl ? stageEl.clientHeight : 260;
            const dpr = window.devicePixelRatio || 1;

            const bufW = Math.round(stageW * dpr);
            const bufH = Math.round(stageH * dpr);
            if (cv2.width !== bufW || cv2.height !== bufH) {
                cv2.width = bufW;
                cv2.height = bufH;
            }

            if (c2.resetTransform) c2.resetTransform();
            else c2.setTransform(1, 0, 0, 1, 0, 0);

            c2.clearRect(0, 0, bufW, bufH);

            const pixelScale = (stageW / 140) * dpr;
            c2.scale(pixelScale, pixelScale);

            // Virtuelle Koordinatenhöhe (gleiches 140er-Raster wie cv)
            const vHeight = stageH / (stageW / 140);
            const floorY = vHeight - 6;
            const tableX1 = 18;
            const tableX2 = 122;

            // Die Ablagefläche ist komplett unsichtbar (kein c2.fillRect für den Tisch/Boden)

            const gravity = 140;
            const halfH = CTH / 2; // 6

            fallingCigs.forEach((fc, idx) => {
                if (fc.settled) return;

                // Natürliche Fallbewegung & sanfte Luftreibung
                fc.vy += gravity * dt;
                fc.vx *= Math.pow(0.985, dt * 60);
                fc.omega *= Math.pow(0.965, dt * 60);

                fc.x += fc.vx * dt;
                fc.y += fc.vy * dt;
                fc.angle += fc.omega * dt;

                // Aus dem Sichtbereich gefallen
                if (fc.y > vHeight + 35) {
                    fc.fellOff = true;
                    return;
                }

                // Prüfen ob Zigarette über der Ablagefläche ist
                const isOverTable = (fc.x >= tableX1 - 8 && fc.x <= tableX2 + 8);

                if (!isOverTable) {
                    // Fällt daneben: Kippt natürlich über die Kante ab und stürzt ab
                    if (fc.y > floorY - 18) {
                        fc.omega += (fc.x < tableX1 ? -1.0 : 1.0) * dt * 4;
                    }
                    return;
                }

                // Bestimme Auflagehöhe (auf Boden oder auf bereits liegenden Zigaretten)
                let targetSurfaceY = floorY - halfH;

                for (let j = 0; j < idx; j++) {
                    const other = fallingCigs[j];
                    if (!other.settled || other.fellOff) continue;

                    const dx = Math.abs(fc.x - other.x);
                    if (dx < 70) {
                        const stackY = other.y - CTH + 1;
                        if (stackY < targetSurfaceY) {
                            targetSurfaceY = stackY;
                        }
                    }
                }

                // Aufprall / Auflage
                if (fc.y >= targetSurfaceY) {
                    fc.y = targetSurfaceY;

                    if (fc.vy > 0) {
                        if (fc.vy > 12) spawnImpactCrumbs(fc.x - 30 + Math.random() * 60, targetSurfaceY + halfH, 2);
                        playCigaretteLandSound();
                        fc.vy = -fc.vy * 0.10; // Sanfter Puffer
                    }
                    fc.vx *= 0.40;
                    fc.omega *= 0.20;
                    fc.angle *= 0.50;

                    // Wenn nah am Rand, rutscht sie seitlich ab
                    if (fc.x < tableX1 + 12) {
                        fc.vx -= 10;
                        fc.omega -= 0.7;
                    } else if (fc.x > tableX2 - 12) {
                        fc.vx += 10;
                        fc.omega += 0.7;
                    }

                    // Stabiler Ruhezustand: Liegt exakt horizontal (angle = 0) und integer-eingerastet gegen jeden Pixelblur!
                    if (Math.abs(fc.vy) < 3.5 && Math.abs(fc.vx) < 1.8 && Math.abs(fc.omega) < 0.15) {
                        fc.settled = true;
                        fc.vx = 0;
                        fc.vy = 0;
                        fc.omega = 0;
                        fc.angle = 0; // Exakt flach ausgerichtet!
                        fc.x = Math.round(fc.x);
                        fc.y = Math.round(fc.y);
                    }
                }
            });

            // Tabakbrösel / Asche aktualisieren und zeichnen
            for (let i = looseCrumbs.length - 1; i >= 0; i--) {
                const cr = looseCrumbs[i];
                cr.vy += 120 * dt;
                cr.x += cr.vx * dt;
                cr.y += cr.vy * dt;
                if (cr.x >= tableX1 && cr.x <= tableX2 && cr.y >= floorY) {
                    cr.y = floorY;
                    cr.vy = -cr.vy * 0.2;
                    cr.vx *= 0.6;
                }
                if (cr.y > vHeight + 20) {
                    looseCrumbs.splice(i, 1);
                    continue;
                }
                c2.fillStyle = cr.col;
                c2.fillRect(Math.round(cr.x), Math.round(cr.y), 1, 1);
            }

            // Alle aktiven Zigaretten zeichnen (bei settled: integer coordinates & angle=0 für gestochen scharfen Retro-Look)
            fallingCigs.forEach(fc => {
                if (fc.fellOff) return;
                const drawX = fc.settled ? Math.round(fc.x) : fc.x;
                const drawY = fc.settled ? Math.round(fc.y) : fc.y;
                drawCigarette(c2, drawX, drawY, fc.angle);
            });
        }

        function draw(ts) {
            const dt = prevT ? Math.min((ts - prevT) / 1000, 0.05) : 0;
            prevT = ts;
            S = calc();
            if (S.state === 'done' && !wasDone) {
                render();
            }
            $('time').textContent = fmt(S.state === 'wait' ? TOTAL : S.remain);
            $('clock').textContent = new Date(now()).toLocaleTimeString('de-DE');

            // Neue Runde erkannt
            if (S.state === 'wait' && S.n === 0 && lastCompleted > 0) {
                fallingCigs.length = 0; looseCrumbs.length = 0; lastCompleted = 0; rollSeed = 17;
            }

            const n = S.n, remain = S.remain;

            // Rolling-Animation mit dezenten Papier-Rollgeräuschen
            if (S.state === 'wait') {
                // Langsamer Idle-Loop mit feinem Papierrascheln
                const idleP = (Date.now() / 14000) % 0.93;
                checkPaperSound(idleP, -99);
                drawRolling(idleP, rollSeed);
            } else if (S.state === 'run') {
                const done = completedCount(n, remain);
                if (done < n) {
                    const totalDur = demoRun ? demoRun.totalDuration : TOTAL;
                    const startR = totalDur * (n - done) / n;
                    const endR = totalDur * (n - done - 1) / n;
                    const phase = Math.max(0, Math.min(1, (startR - remain) / (startR - endR)));
                    checkPaperSound(phase, done);
                    drawRolling(phase, rollSeed);
                } else {
                    c.clearRect(0, 0, RW, RH);
                }
            } else {
                c.clearRect(0, 0, RW, RH);
            }

            // Fertige Zigaretten starten Fallanimation in cv2 hinter dem Text
            const nowDone = completedCount(n, remain);
            while (lastCompleted < nowDone && lastCompleted < n) {
                const spawnX = CX0 + CTW / 2 + (Math.random() - 0.5) * 14;
                fallingCigs.push({
                    x: spawnX,
                    y: -6, // Nahtloser Übergang direkt am oberen Rand von cv2
                    vx: (Math.random() - 0.5) * 8,
                    vy: 105 + Math.random() * 15,
                    angle: 0.10 + (Math.random() - 0.5) * 0.04,
                    omega: (Math.random() - 0.5) * 0.4,
                    settled: false,
                    fellOff: false
                });
                rollSeed = (rollSeed * 37 + 13) % 100;
                lastCompleted++;
            }

            updateAndDrawStack(dt);
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw); setInterval(render, 500);

                btn: 'Zum Magazin-Start',

        const SPR = [
            ['..11111.', '.1222221', '12322221', '12222221', '.1222221', '..11111.', '..1..1..', '.11.11..'],
            ['...11...', '..1221..', '.122221.', '12222221', '12222221', '.122221.', '..1111..', '...11...'],
            ['11111111', '12222221', '12333321', '12333321', '12333321', '12222221', '11111111', '..1..1..']];
        const PAL = [['#111', '#ffd23f', '#e8553d'], ['#111', '#5ec2ff', '#fff'], ['#111', '#7be07b', '#fff']];
        function sprite(i, f) {
            const cn = document.createElement('canvas'); cn.width = cn.height = 8; cn.className = 'spr'; const x = cn.getContext('2d'); const p = PAL[i % 3];
            SPR[i % 3].forEach((row, yy) => [...row].forEach((ch, xx) => { if (ch !== '.') { x.fillStyle = p[ch - 1]; x.fillRect(xx, yy + (f ? 1 : 0) * (yy < 6 ? 0 : 0), 1, 1) } })); return cn
        }
        function makeDraggable(el) {
            const bar = el.querySelector('.bar');
            bar.style.cursor = 'grab';
            let sx, sy, sl, st;

            function startDrag(clientX, clientY) {
                sx = clientX; sy = clientY;
                sl = parseInt(el.style.left) || 0;
                st = parseInt(el.style.top) || 0;
                bar.style.cursor = 'grabbing';
                el.style.zIndex = 99;
            }

            function doDrag(clientX, clientY) {
                el.style.left = (sl + clientX - sx) + 'px';
                el.style.top = (st + clientY - sy) + 'px';
            }

            function stopDrag() {
                bar.style.cursor = 'grab';
                el.style.zIndex = 50;
            }

            bar.addEventListener('mousedown', e => {
                e.preventDefault();
                startDrag(e.clientX, e.clientY);
                function onMove(e) { doDrag(e.clientX, e.clientY); }
                function onUp() {
                    stopDrag();
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            bar.addEventListener('touchstart', e => {
                const touch = e.touches[0];
                if (!touch) return;
                startDrag(touch.clientX, touch.clientY);
                function onTouchMove(e) {
                    const t = e.touches[0];
                    if (!t) return;
                    doDrag(t.clientX, t.clientY);
                }
                function onTouchEnd() {
                    stopDrag();
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                }
                document.addEventListener('touchmove', onTouchMove, { passive: true });
                document.addEventListener('touchend', onTouchEnd, { passive: true });
            }, { passive: true });
        }
        function popup() {
            if (document.hidden) return;
            const d = document.createElement('div'); d.className = 'pop';
            const maxW = Math.max(10, innerWidth - 320);
            d.style.left = Math.max(10, Math.floor(Math.random() * maxW)) + 'px';
            const maxH = Math.max(70, innerHeight - 240);
            d.style.top = Math.max(60, Math.floor(60 + Math.random() * (maxH - 60))) + 'px';
            const item = POPUPS[Math.floor(Math.random() * POPUPS.length)];
            const i = Math.floor(Math.random() * 3);
            d.innerHTML = `<div class="bar"><span>${item.title}</span><b>X</b></div><div class="body"><span class="spr-slot"></span><div class="pop-content"><div>${item.text}</div><a class="pop-link ${item.alt ? 'alt' : ''}" href="${item.url}" target="_blank" rel="noopener noreferrer">${item.btn}</a></div></div>`;
            const sp = sprite(i);
            d.querySelector('.spr-slot').replaceWith(sp);
            let f = 0; const iv = setInterval(() => { f ^= 1; sp.style.transform = f ? 'translateY(-3px)' : 'none' }, 350);
            d.querySelector('b').onclick = () => { clearInterval(iv); d.remove() };
            makeDraggable(d);
            document.body.appendChild(d);
            setTimeout(() => { clearInterval(iv); d.remove() }, 22000);
        }
        (function loop() { setTimeout(() => { if (document.querySelectorAll('.pop').length < 3) popup(); loop() }, 6000 + Math.random() * 12000) })();

        syncClock().then(pull);
    </script>
